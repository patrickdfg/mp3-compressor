name: Check and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/app.js && node --check docs/encoder-worker.js
      - run: node --test tests/test_web_encoder.cjs
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MP3-Compressor app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MP3-Compressor-Windows
          path: |
            dist/MP3-Compressor.exe
            README.md
